name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repository. The release job in
# build-binaries.yml is the only thing that needs write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and protocol fidelity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Static analysis
        run: python -m pyflakes vmsg.py vmsg_core tests tools

      # Deterministic: starts servers in-process, no background process and no
      # sleep to race against. Runs without VISA hardware.
      - name: Protocol fidelity (offline)
        run: python tools/verify_offline.py

      - name: Integration tests
        shell: bash
        env:
          VMSG_API_TOKEN: ci-test-token
        run: |
          python vmsg.py &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          # Poll for readiness instead of sleeping a fixed interval.
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/api/status >/dev/null 2>&1; then
              echo "gateway ready after ${i}s"; break
            fi
            if [ "$i" = "30" ]; then echo "gateway did not start"; exit 1; fi
            sleep 1
          done
          python tests/test_prologix_gateway.py
          python tests/test_query_atomicity_and_config.py
